<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <center><h1>Formulário de Cadastro</h1></center>
    <p style="font-family: Times New Roman; font-size: 20px;color: red;">Realize o
         Cadastro e concorra a premios</p>
         <form>
            <label>Nome Completo</label>
            <input type = "text" placeholder="Insira seu nome" required/>
            <br><br>
            <label>Data de Nascimento</label>
            <input type="date"/>
            <br><br>
            <label>CPF</label>
            <input type ="number"/>
            <br><br>
            <label>Você nos indicaria?</label>
            <input type="number" min="1" max="5"/>
            <br><br>
            <label> Email</label>
            <input type="email" placeholder="informe seu email" required/>
            <br><br>
            <label>cor favorita</label>
            <input type="color"/>
            <br><br>
            <label> Em qual volume você ouve música (0 a 100)</label>
            <input id = "volume" type="range" min="0" max="100" value="50"
            oninput="atualizarVolume(this.value)" style="accent-color: red;"/>
            <span id="valor-volume">50</span>
            <br><br>
            <fieldset>
                <legend>Gênero</legend>
                <input type="radio"/>
                <label>Masculino</label>
                <input type="radio"/>
                <label>Feminino</label>
            </fieldset>
            <fieldset>
                <legend>Monte seu lanche! 🍔</legend>
                <input type ="checkbox" id = "salada" style="accent-color: green;"/>
                <label>Saída</label>
                <input type="checkbox" id = "hamburger" style="accent-color: brown"/>
                <label> hamburger</label>
                <input type="checkbox" id="bacon" style="accent-color: gold;"/>
                <label >Bacon</label>
                <input type="checkbox" id="maionese" style="accent-color: rgb(138, 239,
                138);"/>
                <label> Maionese caseira da casa</label>
            </fieldset>
            <br><br>
            <label>Informações Adicionais</label>
                <textarea id = "info"></textarea>
                <br><br>
                <label>Senha</label>
                <input type="passaword"/>
                <br><br>
                <label>informe a cidade</label>
                <select id = "cidade">
                    <option>Jaguariuna</option>
                    <option>Pedreira</option>
                    <option>Amparo</option>
                    <option>Arcadas</option>
                    <option>Bragança Paulista</option>
                    <option>Serra Negra</option>
                </select>
         </form>
         <script>
            function atualizarVolume(valor){
                document.gotElementById("valor-volume").textContent = valor;
            }
         </script>
</body>
</html>
